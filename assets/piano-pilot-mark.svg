<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 28 48 52" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Piano Pilot "play keys" mark: a rounded play triangle split into three
       keys, with two black keys entering from the left. Gaps are transparent. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#E5397A"/>
    </linearGradient>
    <mask id="keys" maskUnits="userSpaceOnUse" x="20" y="20" width="70" height="70">
      <rect x="20" y="20" width="70" height="70" fill="#fff"/>
      <rect x="20" y="45.4" width="62" height="1.8" fill="#000"/>
      <rect x="20" y="60.8" width="62" height="1.8" fill="#000"/>
      <rect x="20" y="42.3" width="31" height="8" rx="2.5" fill="#000"/>
      <rect x="20" y="57.7" width="31" height="8" rx="2.5" fill="#000"/>
    </mask>
  </defs>
  <path mask="url(#keys)" fill="url(#g)"
        d="M40,31 C36.5,29 33,31 33,35 V73 C33,77 36.5,79 40,77 L76,56.6 C78.4,55.3 78.4,52.7 76,51.4 Z"/>
</svg>
